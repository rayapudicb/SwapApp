name: swappy_mobile
description: "Swappy reference client for iOS and Android."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.2
  go_router: ^17.2.3
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  passwordless_identity:
    path: packages/passwordless_identity
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/city_finals_hero.png
